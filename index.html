<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal defenses - Flashcards & Quiz</title>
    <style>
        :root { --primary: #1a73e8; --primary-dark: #0d47a1; --bg: #eef2f6; --card-bg: #ffffff; --text-dark: #1f2937; --text-muted: #6b7280; --success: #16a34a; --danger: #dc2626; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text-dark); margin: 0; padding: 20px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .presentation-container { width: 90%; max-width: 800px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 30px 40px; position: relative; min-height: 620px; display: flex; flex-direction: column; justify-content: space-between; }
        
        .page { display: none; flex-direction: column; justify-content: space-between; flex-grow: 1; animation: fadeIn 0.3s ease-in-out; }
        .page.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 頂部列與導航按鈕 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f3f4f6; padding-bottom: 12px; margin-bottom: 15px; }
        .student-tag { font-size: 15px; font-weight: bold; color: var(--primary-dark); background: #e8f0fe; padding: 4px 12px; border-radius: 12px; }
        .page-indicator { font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .home-nav-btn { background-color: #f1f5f9; color: var(--primary-dark); border: 1px solid #cbd5e1; padding: 5px 12px; border-radius: 15px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .home-nav-btn:hover { background-color: #e2e8f0; }

        /* 封面頁 */
        .welcome-screen { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 400px; gap: 18px; }
        .welcome-title { font-size: 28px; color: var(--primary-dark); font-weight: 800; }
        .welcome-input { padding: 12px 20px; font-size: 18px; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; text-align: center; width: 260px; transition: 0.2s; }
        .welcome-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.2); }
        .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
        .start-btn { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(26,115,232,0.3); }
        .listen-btn { background-color: #f1f5f9; color: var(--primary-dark); border: 2px solid var(--primary); padding: 12px 20px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .quiz-btn { background-color: #fef3c7; color: #b45309; border: 2px solid #f59e0b; padding: 12px 20px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; }

        /* 聽力模式牆 */
        .listen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; max-height: 400px; overflow-y: auto; padding: 10px; margin-top: 10px; }
        .listen-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .listen-card:hover { border-color: var(--primary); background: #e8f0fe; transform: translateY(-2px); }
        .listen-word { font-size: 18px; font-weight: bold; color: var(--primary-dark); }
        .listen-zh { font-size: 13px; color: var(--text-muted); }

        /* 單字卡風格 */
        .word-section { text-align: center; margin: 5px 0 15px 0; }
        .icon-large { font-size: 56px; margin-bottom: 5px; display: inline-block; }
        .word-title { font-size: 36px; font-weight: 800; color: var(--primary-dark); margin: 5px 0; }
        .word-translation { font-size: 20px; color: var(--text-muted); font-weight: 600; margin-bottom: 12px; }
        .word-audio-btn { background-color: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 25px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .sentence-container { background-color: #f8fafc; border-left: 6px solid var(--primary); border-radius: 12px; padding: 16px 20px; margin-top: 10px; }
        .sentence-en { font-size: 18px; line-height: 1.5; color: #0f172a; font-weight: 500; margin-bottom: 8px; }
        .sentence-zh { font-size: 15px; color: #475569; line-height: 1.4; }
        .highlight { color: var(--primary); font-weight: 700; text-decoration: underline; }
        
        .sentence-audio-area { display: flex; flex-direction: column; align-items: center; margin-top: 15px; }
        .btn-subtle { background-color: #e8f0fe; color: var(--primary); border: none; padding: 8px 18px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; }
        
        /* 錄音控制區 */
        .record-box { margin-top: 15px; width: 100%; background: #f0fdf4; border: 2px solid #bbf7d0; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .rec-status { font-size: 14px; font-weight: bold; color: var(--danger); display: none; }
        .rec-status.active { display: inline-block; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .record-actions { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .record-action-btn { background-color: var(--success); color: white; border: none; padding: 10px 22px; border-radius: 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .record-action-btn.recording { background-color: var(--danger); }
        .upload-action-btn { background-color: var(--primary); color: white; border: none; padding: 10px 22px; border-radius: 20px; font-size: 15px; font-weight: 600; cursor: pointer; display: none; }
        .audio-preview { width: 100%; max-width: 400px; height: 36px; margin-top: 5px; display: none; }
        
        .nav-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 15px; border-top: 2px solid #f3f4f6; }
        .nav-btn { background-color: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .nav-btn:disabled { background-color: #d1d5db; cursor: not-allowed; }
        .keyboard-hint { font-size: 12px; color: #9ca3af; text-align: center; margin-top: 12px; }

        /* 測驗模式樣式 */
        .quiz-container { display: flex; flex-direction: column; gap: 20px; align-items: center; margin-top: 20px; }
        .quiz-word { font-size: 38px; font-weight: bold; color: var(--primary-dark); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; }
        .option-btn { background: #f8fafc; border: 2px solid #cbd5e1; padding: 16px; border-radius: 14px; font-size: 18px; font-weight: 600; cursor: pointer; transition: 0.2s; color: var(--text-dark); }
        .option-btn:hover { border-color: var(--primary); background: #e8f0fe; }
        .option-btn.wrong { border-color: var(--danger) !important; background-color: #fef2f2 !important; color: var(--danger) !important; font-weight: bold; }
        .option-btn.correct { border-color: var(--success) !important; background-color: #f0fdf4 !important; color: var(--success) !important; font-weight: bold; }
        .quiz-result { text-align: center; display: none; flex-direction: column; gap: 20px; align-items: center; }
        .score-display { font-size: 42px; font-weight: 800; color: var(--primary-dark); }
    </style>
</head>
<body>

<div class="presentation-container">
    <!-- 1. 封面頁 -->
    <div class="page active" id="welcome-page">
        <div class="welcome-screen">
            <div style="font-size: 60px;">🛡️</div>
            <div class="welcome-title">Animal defenses<br><span style="font-size:18px; color: var(--text-muted);">英文學習與測驗系統</span></div>
            <input type="text" id="studentNameInput" class="welcome-input" placeholder="請輸入你的姓名" autofocus>
            
            <div class="btn-group">
                <button class="listen-btn" onclick="checkNameAndRun(openListeningMode)">🎧 聽力練習</button>
                <button class="start-btn" onclick="checkNameAndRun(startPractice)">🎤 錄音練習</button>
                <button class="quiz-btn" onclick="checkNameAndRun(startQuiz)">📝 單字測驗</button>
            </div>
        </div>
    </div>

    <!-- 2. 聽力練習牆 -->
    <div class="page" id="listening-page">
        <div>
            <div class="top-bar">
                <span class="student-tag">🎧 聽力自主練習區</span>
                <button class="home-nav-btn" onclick="goHome()">🏠 選單首頁</button>
            </div>
            <div class="listen-grid" id="listenGrid"></div>
        </div>
        <div class="sentence-audio-area">
            <button class="start-btn" onclick="startPractice()">準備好了，開始錄音練習 🎤</button>
        </div>
    </div>

    <!-- 3. 正式單字卡錄音頁面 -->
    <div class="page" id="card-page">
        <div>
            <div class="top-bar">
                <span class="student-tag" id="displayStudentName">學生：--</span>
                <button class="home-nav-btn" onclick="goHome()">🏠 選單首頁</button>
            </div>
            
            <div class="word-section">
                <div class="icon-large" id="cardIcon">✨</div>
                <div class="word-title" id="cardWord">predators</div>
                <div class="word-translation" id="cardTranslation">捕食者、掠食動物</div>
                <button class="word-audio-btn" onclick="speakCurrentWord()">🔊 朗讀單字</button>
            </div>
            
            <div class="sentence-container">
                <div class="sentence-en" id="cardSentenceEn">...</div>
                <div class="sentence-zh" id="cardSentenceZh">...</div>
            </div>
        </div>

        <div class="sentence-audio-area">
            <button class="btn-subtle" onclick="speakCurrentSentence()">🔊 朗讀課文例句</button>
        </div>

        <div class="record-box">
            <div class="rec-status" id="recStatus">🔴 正在錄音中...（可任意切換頁面唸，唸完按停止即可）</div>
            <div class="record-actions">
                <button class="record-action-btn" id="recordBtn" onclick="toggleRecording()">🎤 開始錄音</button>
                <button class="upload-action-btn" id="uploadBtn" onclick="uploadAudio()">📤 傳送語音作業</button>
            </div>
            <audio class="audio-preview" id="audioPreview" controls></audio>
        </div>

        <div class="nav-controls">
            <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">← 上一個</button>
            <span style="font-weight: bold; color: var(--text-muted);" id="pageCounter">1 / 15</span>
            <button class="nav-btn" id="nextBtn" onclick="changePage(1)">下一個 →</button>
        </div>
    </div>

    <!-- 4. 單字測驗頁面 -->
    <div class="page" id="quiz-page">
        <div>
            <div class="top-bar">
                <span class="student-tag" id="quizStudentName">學生：--</span>
                <div>
                    <span class="page-indicator" id="quizProgress" style="margin-right:10px;">第 1 / 15 題</span>
                    <button class="home-nav-btn" onclick="goHome()">🏠 選單首頁</button>
                </div>
            </div>

            <!-- 測驗進行中 -->
            <div class="quiz-container" id="quizBox">
                <div class="quiz-word" id="quizWord">predators</div>
                <button class="btn-subtle" onclick="speakQuizWord()">🔊 發音</button>
                <div class="options-grid" id="optionsGrid"></div>
            </div>

            <!-- 測驗結束結算 -->
            <div class="quiz-result" id="quizResultBox">
                <div style="font-size: 60px;">🏆</div>
                <h2>測驗完成！</h2>
                <div class="score-display" id="finalScore">答對 0 / 15 題</div>
                <div style="display:flex; gap:10px;">
                    <button class="start-btn" id="uploadScoreBtn" onclick="uploadQuizScore()">📤 傳送成績至試算表</button>
                    <button class="listen-btn" onclick="startQuiz()">🔄 再測驗一次</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="keyboard-hint" id="keyboardHint" style="display:none;">💡 提示：切換頁面時會<b>自動發音單字</b>，亦可使用鍵盤 <b>← 左右方向鍵 →</b> 切換</div>

<script>
    const cardsData = [
        {
            word: "predators",
            zh: "捕食者、掠食動物",
            icon: "🦅",
            enSent: "Animals have clever ways to protect themselves from <span class='highlight'>predators</span>.",
            zhSent: "動物們有巧妙的方法來保護自己免受掠食者的侵害。",
            rawSent: "Animals have clever ways to protect themselves from predators."
        },
        {
            word: "developed",
            zh: "發展出、形成",
            icon: "📈",
            enSent: "Over time, many species have <span class='highlight'>developed</span> unique defense mechanisms.",
            zhSent: "隨著時間過去，許多物種已經發展出獨特的防禦機制。",
            rawSent: "Over time, many species have developed unique defense mechanisms."
        },
        {
            word: "hedgehog",
            zh: "刺蝟",
            icon: "🦔",
            enSent: "A frightened <span class='highlight'>hedgehog</span> rolls up into a tight ball.",
            zhSent: "受到驚嚇的刺蝟會捲成緊密的球狀。",
            rawSent: "A frightened hedgehog rolls up into a tight ball."
        },
        {
            word: "porcupine",
            zh: "豪豬",
            icon: "⚡",
            enSent: "A <span class='highlight'>procupine</span> relies on its sharp defensive spikes for safety.",
            zhSent: "豪豬依靠其尖銳的防禦性刺來確保安全。",
            rawSent: "A procupine relies on its sharp defensive spikes for safety."
        },
        {
            word: "quills",
            zh: "豪豬刺、硬羽",
            icon: "📌",
            enSent: "The sharp <span class='highlight'>quills</span> on its back can easily prick attackers.",
            zhSent: "它背上的尖銳硬刺可以輕易刺傷攻擊者。",
            rawSent: "The sharp quills on its back can easily prick attackers."
        },
        {
            word: "needles",
            zh: "針葉、細針",
            icon: "🌲",
            enSent: "Some plants and animals feature structures as sharp as <span class='highlight'>needles</span>.",
            zhSent: "某些動植物具有像針一樣銳利的結構。",
            rawSent: "Some plants and animals feature structures as sharp as needles."
        },
        {
            word: "venom",
            zh: "毒液",
            icon: "🐍",
            enSent: "Certain creatures inject <span class='highlight'>venom</span> to immobilize their enemies.",
            zhSent: "某些生物會注射毒液來使敵人動彈不得。",
            rawSent: "Certain creatures inject venom to immobilize their enemies."
        },
        {
            word: "wasps",
            zh: "黃蜂、胡蜂",
            icon: "🐝",
            enSent: "Social insects like <span class='highlight'>wasps</span> will sting to defend their nests.",
            zhSent: "像黃蜂這樣的群居昆蟲會透過螫刺來保衛它們的巢穴。",
            rawSent: "Social insects like wasps will sting to defend their nests."
        },
        {
            word: "poisonous",
            zh: "有毒的",
            icon: "☠️",
            enSent: "Brightly colored skin often warns predators that an animal is <span class='highlight'>poisonous</span>.",
            zhSent: "鮮豔的皮膚通常在警告掠食者這隻動物是有毒的。",
            rawSent: "Brightly colored skin often warns predators that an animal is poisonous."
        },
        {
            word: "substance",
            zh: "物質",
            icon: "🧪",
            enSent: "Some frogs secrete a toxic <span class='highlight'>substance</span> from their skin.",
            zhSent: "有些青蛙會從皮膚分泌一種有毒物質。",
            rawSent: "Some frogs secrete a toxic substance from their skin."
        },
        {
            word: "coated",
            zh: "覆蓋著的",
            icon: "🍯",
            enSent: "Their skin is <span class='highlight'>coated</span> with a slippery or sticky layer.",
            zhSent: "它們的皮膚覆蓋著一層滑溜或黏稠的保護層。",
            rawSent: "Their skin is coated with a slippery or sticky layer."
        },
        {
            word: "camouflage",
            zh: "保護色、偽裝",
            icon: "🦎",
            enSent: "Chameleons use <span class='highlight'>camouflage</span> to blend into their surroundings.",
            zhSent: "變色龍利用偽裝來融入周遭環境中。",
            rawSent: "Chameleons use camouflage to blend into their surroundings."
        },
        {
            word: "hognose",
            zh: "豬鼻蛇",
            icon: "🐍",
            enSent: "The <span class='highlight'>hognose</span> snake is famous for playing dead when threatened.",
            zhSent: "豬鼻蛇以在受威脅時裝死而聞名。",
            rawSent: "The hognose snake is famous for playing dead when threatened."
        },
        {
            word: "liquid",
            zh: "液體",
            icon: "💧",
            enSent: "Skunks spray a foul-smelling <span class='highlight'>liquid</span> to drive away pursuers.",
            zhSent: "臭鼬會噴灑發臭的液體來驅趕追逐者。",
            rawSent: "Skunks spray a foul-smelling liquid to drive away pursuers."
        },
        {
            word: "distract",
            zh: "轉移注意、分散心思",
            icon: "👀",
            enSent: "Some animals lose their tails to <span class='highlight'>distract</span> hungry hunters.",
            zhSent: "有些動物會斷尾來轉移飢餓獵人的注意力。",
            rawSent: "Some animals lose their tails to distract hungry hunters."
        }
    ];

    let currentIndex = 0;
    let studentName = "";
    let uploadCount = 0;
    
    // 最新部署網址 (保留原本的設定)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx6nIx8PqMb3pKo02c3X8HaDm89_9d4Rc3mZoQVaEpZeTe4klCJf-eLZvPCgctmQSj4/exec';
    
    let audioStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let currentBlob = null;

    let quizIndex = 0;
    let quizScore = 0;
    let quizList = [];
    let canAnswer = true;

    function checkNameAndRun(callback) {
        const nameInput = document.getElementById('studentNameInput').value.trim();
        if (!nameInput && !studentName) {
            alert('請先輸入學生姓名喔！');
            return;
        }
        if (nameInput) studentName = nameInput;
        callback();
    }

    function goHome() {
        switchPage('welcome-page');
        document.getElementById('keyboardHint').style.display = 'none';
    }

    function openListeningMode() {
        const grid = document.getElementById('listenGrid');
        grid.innerHTML = '';
        cardsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'listen-card';
            card.innerHTML = `<div style="font-size:24px;">${item.icon}</div><div class="listen-word">${item.word}</div><div class="listen-zh">${item.zh}</div>`;
            card.onclick = () => speak(item.word);
            grid.appendChild(card);
        });

        switchPage('listening-page');
    }

    async function startPractice() {
        try {
            if (!audioStream) {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            }
        } catch (err) {
            alert('無法獲取麥克風權限，請確認瀏覽器已允許使用麥克風！');
            return;
        }

        switchPage('card-page');
        document.getElementById('keyboardHint').style.display = 'block';
        document.getElementById('displayStudentName').innerText = `學生：${studentName}`;
        loadCard(0, true);
    }

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function loadCard(index, autoSpeak = false) {
        currentIndex = index;
        const data = cardsData[currentIndex];

        document.getElementById('cardIcon').innerText = data.icon;
        document.getElementById('cardWord').innerText = data.word;
        document.getElementById('cardTranslation').innerText = data.zh;
        document.getElementById('cardSentenceEn').innerHTML = data.enSent;
        document.getElementById('cardSentenceZh').innerText = data.zhSent;

        document.getElementById('pageCounter').innerText = `${currentIndex + 1} / ${cardsData.length}`;
        document.getElementById('prevBtn').disabled = (currentIndex === 0);
        document.getElementById('nextBtn').disabled = (currentIndex === cardsData.length - 1);

        if (autoSpeak) speak(data.word);
    }

    function changePage(direction) {
        let newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < cardsData.length) loadCard(newIndex, true);
    }

    function speakCurrentWord() { speak(cardsData[currentIndex].word); }
    function speakCurrentSentence() { speak(cardsData[currentIndex].rawSent); }

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function toggleRecording() {
        const recordBtn = document.getElementById('recordBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const preview = document.getElementById('audioPreview');
        const recStatus = document.getElementById('recStatus');

        if (!mediaRecorder || mediaRecorder.state === 'inactive') {
            audioChunks = [];
            currentBlob = null;
            mediaRecorder = new MediaRecorder(audioStream);
            
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                currentBlob = new Blob(audioChunks, { type: 'audio/webm' });
                preview.src = URL.createObjectURL(currentBlob);
                preview.style.display = 'block';
                uploadBtn.style.display = 'inline-block';
                uploadBtn.innerText = '📤 傳送語音作業';
                uploadBtn.disabled = false;
            };

            mediaRecorder.start();
            recordBtn.innerText = '⏹️ 停止/結束錄音';
            recordBtn.classList.add('recording');
            recStatus.classList.add('active');
            preview.style.display = 'none';
            uploadBtn.style.display = 'none';
        } else {
            mediaRecorder.stop();
            recordBtn.innerText = '🎤 開始下一段錄音';
            recordBtn.classList.remove('recording');
            recStatus.classList.remove('active');
        }
    }

    function uploadAudio() {
        if (!currentBlob) return alert('請先錄音再上傳！');

        const uploadBtn = document.getElementById('uploadBtn');
        uploadBtn.innerText = '⏳ 上傳中...';
        uploadBtn.disabled = true;

        uploadCount++;
        const fileName = `${studentName}_朗讀作業_${uploadCount}.webm`;

        const reader = new FileReader();
        reader.readAsDataURL(currentBlob);
        reader.onloadend = function() {
            const base64Audio = reader.result.split(',')[1];
            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ audio: base64Audio, mimeType: 'audio/webm', filename: fileName })
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === 'success') {
                    alert(`🎉 作業段落 ${uploadCount} 上傳成功！已存入老師的雲端！`);
                    uploadBtn.innerText = '✅ 上傳成功（可繼續錄下一段）';
                    document.getElementById('recordBtn').innerText = '🎤 開始錄下一段';
                } else {
                    alert('上傳失敗：' + data.error);
                    uploadBtn.innerText = '📤 重新傳送';
                    uploadBtn.disabled = false;
                    uploadCount--;
                }
            })
            .catch(err => {
                alert('上傳發生錯誤，請重試！');
                uploadBtn.innerText = '📤 重新傳送';
                uploadBtn.disabled = false;
                uploadCount--;
            });
        };
    }

    /* ------------------- 單字測驗邏輯 ------------------- */
    function startQuiz() {
        quizIndex = 0;
        quizScore = 0;
        quizList = [...cardsData].sort(() => Math.random() - 0.5);
        
        switchPage('quiz-page');
        document.getElementById('quizStudentName').innerText = `學生：${studentName}`;
        document.getElementById('quizBox').style.display = 'flex';
        document.getElementById('quizResultBox').style.display = 'none';
        
        loadQuizQuestion();
    }

    function loadQuizQuestion() {
        canAnswer = true;
        const currentQ = quizList[quizIndex];
        document.getElementById('quizProgress').innerText = `第 ${quizIndex + 1} / ${quizList.length} 題`;
        document.getElementById('quizWord').innerText = currentQ.word;
        speak(currentQ.word);

        let options = [currentQ.zh];
        let otherZhs = cardsData.map(c => c.zh).filter(z => z !== currentQ.zh).sort(() => Math.random() - 0.5);
        options.push(...otherZhs.slice(0, 3));
        options.sort(() => Math.random() - 0.5);

        const optionsGrid = document.getElementById('optionsGrid');
        optionsGrid.innerHTML = '';

        options.forEach(optText => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = optText;
            btn.onclick = () => checkAnswer(btn, optText, currentQ.zh);
            optionsGrid.appendChild(btn);
        });
    }

    function speakQuizWord() {
        speak(quizList[quizIndex].word);
    }

    function checkAnswer(selectedBtn, selectedText, correctText) {
        if (!canAnswer) return;
        canAnswer = false;

        if (selectedText === correctText) {
            selectedBtn.classList.add('correct');
            quizScore++;
        } else {
            selectedBtn.classList.add('wrong');
            document.querySelectorAll('.option-btn').forEach(btn => {
                if (btn.innerText === correctText) btn.classList.add('correct');
            });
        }

        setTimeout(() => {
            quizIndex++;
            if (quizIndex < quizList.length) {
                loadQuizQuestion();
            } else {
                showQuizResult();
            }
        }, 1200);
    }

    function showQuizResult() {
        document.getElementById('quizBox').style.display = 'none';
        document.getElementById('quizResultBox').style.display = 'flex';
        document.getElementById('finalScore').innerText = `答對 ${quizScore} / ${quizList.length} 題`;
        
        const uploadBtn = document.getElementById('uploadScoreBtn');
        uploadBtn.innerText = '📤 傳送成績至試算表';
        uploadBtn.disabled = false;
    }

    function uploadQuizScore() {
        const uploadBtn = document.getElementById('uploadScoreBtn');
        uploadBtn.innerText = '⏳ 上傳成績中...';
        uploadBtn.disabled = true;

        const formData = new URLSearchParams();
        formData.append('type', 'quiz');
        formData.append('studentName', studentName);
        formData.append('score', quizScore);
        formData.append('total', quizList.length);

        fetch(scriptURL, {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.result === 'success') {
                alert('🎉 測驗成績已成功寫入老師的 Google 試算表！');
                uploadBtn.innerText = '✅ 成績已登錄試算表';
            } else {
                alert('上傳失敗：' + (data.error || '未知錯誤'));
                uploadBtn.innerText = '📤 重新傳送成績';
                uploadBtn.disabled = false;
            }
        })
        .catch(err => {
            alert('上傳發生錯誤，請重試！');
            uploadBtn.innerText = '📤 重新傳送成績';
            uploadBtn.disabled = false;
        });
    }

    document.addEventListener('keydown', function(e) {
        if (!document.getElementById('card-page').classList.contains('active')) return;
        if (e.key === 'ArrowLeft') changePage(-1);
        if (e.key === 'ArrowRight') changePage(1);
    });
</script>
</body>
</html>
